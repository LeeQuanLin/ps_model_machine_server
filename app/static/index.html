<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>样机工作台</title>
    <link rel="stylesheet" href="/static/studio.css?v=5" />
    <script src="/static/studio.js?v=5" defer></script>
  </head>
  <body>
    <aside class="rail">
      <a class="brand" href="#products"><span class="mark" aria-hidden="true">▱</span> 样机工作台</a>
      <nav aria-label="主导航">
        <a href="#products" data-view="products"><span class="icon" data-icon="layers"></span>产品列表</a>
        <a href="#exports" data-view="exports"><span class="icon" data-icon="archive"></span>导出记录</a>
        <a href="#queue" data-view="queue"><span class="icon" data-icon="queue"></span>任务队列</a>
        <a href="#logs" data-view="logs"><span class="icon" data-icon="logs"></span>日志</a>
        <a href="#outputs" data-view="outputs"><span class="icon" data-icon="gallery"></span>输出图管理</a>
      </nav>
      <div class="rail-footer">
        <section class="storage" id="storage" aria-label="磁盘空间">
          <p><span>磁盘空间 <small id="diskDrive"></small></span><b id="diskTotal">—</b></p>
          <div class="storage-bar" id="storageBar" role="progressbar" aria-label="可用空间" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="diskFreeBar"></i></div>
          <p class="storage-foot"><span>可用 <b id="diskFree">—</b></span><span title="项目数据目录（data/studio）占用">已占用 <b id="projectUsed">—</b></span></p>
        </section>
        <button class="access" id="access"><i></i><span id="accessLabel">连接工作台</span></button>
      </div>
    </aside>
    <main>
      <header class="top">
        <span>工作空间 <span class="slash">/</span> <strong id="crumb">产品列表</strong></span
        ><span class="clock" id="today"></span>
      </header>
      <section id="records">
        <div class="heading">
          <h1 id="pageTitle">产品列表</h1>
          <div class="actions">
            <button class="secondary" id="refresh"><span data-icon="refresh"></span>刷新</button>
            <button class="primary" id="newProduct"><span data-icon="plus"></span>新增产品</button>
          </div>
        </div>
        <div class="panel record-panel">
          <div class="panel-head">
            <div class="actions">
              <h2 id="recordTitle"></h2>
              <span class="fine" id="recordCount"></span>
            </div>
            <button class="secondary" id="exportSelected" disabled>批量导出</button>
          </div>
          <div id="recordsBody"></div>
          <div class="pagination" id="pager" hidden>
            <button id="prev">上一页</button><span id="pageNumber"></span><button id="next">下一页</button>
          </div>
        </div>
      </section>
      <p id="notice" role="status" aria-live="polite" hidden></p>
    </main>
    <dialog id="productDialog" aria-labelledby="productTitle">
      <form id="productForm">
        <div class="dialog-head">
          <h2 id="productTitle">新增产品</h2>
          <button class="close" type="button" aria-label="关闭">×</button>
        </div>
        <label class="field">产品名
          <input id="productName" placeholder="输入产品名" maxlength="200" required />
        </label>
        <div class="product-skus-head">
          <h3>SKU 列表 <span class="fine" id="skuCount"></span></h3>
          <button class="secondary" type="button" id="addSku"><span data-icon="plus"></span>添加产品图</button>
        </div>
        <div id="skuList"></div>
        <p id="productError" class="form-error" role="alert"></p>
        <div class="dialog-foot">
          <span class="fine" id="productHint">提交 SKU 后立即排队出图。</span>
          <button class="primary" id="saveProduct" disabled>保存产品</button>
        </div>
      </form>
    </dialog>
    <dialog id="renameDialog" aria-labelledby="renameTitle">
      <form id="renameForm">
        <div class="dialog-head">
          <h2 id="renameTitle">修改产品名</h2>
          <button class="close" type="button" aria-label="关闭">×</button>
        </div>
        <label class="field">产品名
          <input id="renameName" maxlength="200" required />
        </label>
        <p id="renameError" class="form-error" role="alert"></p>
        <div class="dialog-foot rename-foot">
          <button class="secondary" type="button" id="cancelRename">取消</button>
          <button class="primary" id="saveRename">保存</button>
        </div>
      </form>
    </dialog>
    <dialog id="generate" aria-labelledby="generateTitle">
        <div class="dialog-head">
          <h2 id="generateTitle">添加产品图</h2>
          <button type="button" class="close" aria-label="关闭">×</button>
        </div>
        <div class="sku-fields">
          <label class="field">SKU 名
            <input id="skuName" type="text" placeholder="输入 SKU 名" maxlength="200" required />
          </label>
          <label class="field"
            >样机模板<select id="template" required>
              <option value="random">随机选择</option>
              <option value="sequential">顺序选择</option>
              <optgroup id="templateFiles" label="指定样机"></optgroup>
            </select></label
          >
        </div>
        <div class="workspace">
          <section class="panel controls">
            <div class="panel-head"><h2>图层设置</h2></div>
            <div class="control">
              <div class="label">
                <span class="glyph">A</span>
                <h3>A 面</h3>
                <small>图案</small>
              </div>
              <label class="file" for="art"
                ><span data-icon="upload"></span><span id="artName">点击或拖入 A 面图片</span
                ><input id="art" type="file" accept="image/png,image/jpeg" /></label
              ><button id="clearArt" class="textbtn" hidden>移除图片</button>
            </div>
            <div class="control">
              <div class="label">
                <span class="glyph">B</span>
                <h3>B 面</h3>
                <small>纯色</small>
              </div>
              <div id="swatches" class="swatches" aria-label="B 面预设颜色"><!-- B_SIDE_SWATCHES --></div>
              <label class="picker"
                ><input type="color" id="bColor" /><span id="bHex"></span
                ><span class="muted">自选颜色</span></label
              >
            </div>
            <div class="control">
              <div class="label">
                <span class="glyph" data-icon="pillow"></span>
                <h3>枕套</h3>
                <small>图案</small>
              </div>
              <label class="file" for="pillow"
                ><span data-icon="upload"></span><span id="pillowName">点击或拖入枕套图片</span
                ><input id="pillow" type="file" accept="image/png,image/jpeg" /></label
              ><button id="clearPillow" class="textbtn" hidden>移除图片</button>
            </div>
            <div class="control">
              <div class="label">
                <span class="glyph" data-icon="background"></span>
                <h3>背景</h3>
                <small>纯色</small>
              </div>
              <div class="switch" aria-label="背景配色方式">
                <button id="autoColor" aria-pressed="true">取 A 面主题色</button
                ><button id="manualColor" aria-pressed="false">手动选色</button>
              </div>
              <label class="picker"
                ><input type="color" id="bgColor" value="#eeeae3" /><span id="bgHex"></span
                ><span class="muted" id="bgHint"></span
              ></label>
            </div>
          </section>
          <section class="panel previews">
            <div class="panel-head">
              <h2>平铺预览</h2>
              <span class="fine">4 个图层</span>
            </div>
            <div class="tiles" id="tiles"></div>
          </section>
        </div>
        <p id="skuError" class="form-error" role="alert"></p>
        <footer class="dialog-foot">
          <span class="fine" id="scope"></span>
          <button class="primary" id="submit"><span data-icon="play"></span>提交并开始出图</button>
        </footer>
    </dialog>
    <dialog id="login">
      <form id="loginForm">
        <div class="dialog-head">
          <h2>连接工作台</h2>
          <button class="close" type="button" aria-label="关闭">×</button>
        </div>
        <label>访问令牌<input type="password" id="token" autocomplete="current-password" required /></label>
        <p id="loginError" role="alert"></p>
        <button class="primary">连接</button>
      </form>
    </dialog>
    <dialog id="viewer">
      <div class="dialog-head">
        <h2 id="viewerTitle"></h2>
        <label id="slicePicker" hidden>切片 <select id="sliceSelect"></select></label>
        <button class="close" aria-label="关闭">×</button>
      </div>
      <img id="fullImage" alt="原尺寸输出图" />
    </dialog>
  </body>
</html>
